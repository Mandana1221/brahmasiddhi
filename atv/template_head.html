<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アートマタットヴァ・ヴィヴェーカ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+Devanagari:wght@400;600&family=Shippori+Mincho:wght@400;600&display=swap">
<style>
:root {
  --ground: #F4F0E8;
  --ink: #2A2520;
  --ink-soft: #5A4D42;
  --accent: #8B4A2B;
  --accent-soft: #C47A54;
  --rule: #C9C1B4;
  --rule-light: #DCD5CA;
  --muted: #7E7265;
  --note-bg: #EDE8DF;
  --card-bg: #FAF7F1;
  --point-bg: #F3E6DA;
  --it-color: #B0413E;
  --ok-color: #4F6B3A;
  /* 論敵ごとの色 */
  --c-self: #8B4A2B;
  --c-mim: #3F6A8A;
  --c-sam: #7A5C99;
  --c-bud: #A0782A;
  --c-car: #4F7A4A;
  --c-gen: #7E7265;
  --c-vai: #2F7F7A;
  --on-c: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1E1D1B;
    --ink: #DDD8D0;
    --ink-soft: #A89E92;
    --accent: #C47A54;
    --accent-soft: #D4956C;
    --rule: #3E3A34;
    --rule-light: #322E2A;
    --muted: #8A7F73;
    --note-bg: #27251F;
    --card-bg: #23211E;
    --point-bg: #2E2620;
    --it-color: #E07A6F;
    --ok-color: #9DBB82;
    --c-self: #C47A54;
    --c-mim: #6E9CC0;
    --c-sam: #A98BC7;
    --c-bud: #C9A55A;
    --c-car: #86B07F;
    --c-gen: #9A8F83;
    --c-vai: #6FB8B2;
    --on-c: #1E1D1B;
  }
}
:root[data-theme="dark"] {
  --ground: #1E1D1B;
  --ink: #DDD8D0;
  --ink-soft: #A89E92;
  --accent: #C47A54;
  --accent-soft: #D4956C;
  --rule: #3E3A34;
  --rule-light: #322E2A;
  --muted: #8A7F73;
  --note-bg: #27251F;
  --card-bg: #23211E;
  --point-bg: #2E2620;
  --it-color: #E07A6F;
  --ok-color: #9DBB82;
  --c-self: #C47A54;
  --c-mim: #6E9CC0;
  --c-sam: #A98BC7;
  --c-bud: #C9A55A;
  --c-car: #86B07F;
  --c-gen: #9A8F83;
  --c-vai: #6FB8B2;
  --on-c: #1E1D1B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: 'Shippori Mincho', 'Noto Serif Devanagari', serif;
  font-size: 1.05rem;
  line-height: 1.95;
  padding: 3rem 1rem 5rem;
  max-width: 860px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.dev { font-family: 'Noto Serif Devanagari', serif; }
.iast { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.08em; }
a { color: var(--accent); }

/* header */
.header { text-align: center; padding-bottom: 2.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--rule); }
.header-devanagari { font-family: 'Noto Serif Devanagari', serif; font-size: 1.5rem; font-weight: 600; margin-bottom: 0.3rem; }
.header h1 { font-family: 'Shippori Mincho', serif; font-weight: 600; font-size: 1.75rem; letter-spacing: 0.08em; color: var(--accent); }
.header-sub { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-style: italic; color: var(--ink-soft); }
.header-jp { font-size: 0.88rem; color: var(--ink-soft); margin-top: 0.6rem; line-height: 1.7; }

/* toc */
.toc { margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--rule-light); }
.toc h2, .section-label { font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.12em; margin-bottom: 0.8rem; }
.toc ol { list-style: none; }
.toc a { color: var(--accent); text-decoration: none; display: flex; gap: 0.7rem; padding: 0.35rem 0; border-bottom: 1px solid var(--rule-light); font-size: 0.95rem; }
.toc a:hover { color: var(--accent-soft); }
.toc .n { color: var(--muted); min-width: 3.2rem; font-size: 0.85rem; }

h2.chapter { font-size: 1.35rem; font-weight: 600; color: var(--accent); margin: 3.5rem 0 0.4rem; letter-spacing: 0.05em; }
.chapter-sub { color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 1.5rem; }
h3 { font-size: 1.08rem; font-weight: 600; margin: 2rem 0 0.6rem; }
p { margin-bottom: 1rem; }

.note { background: var(--note-bg); border-radius: 4px; padding: 0.9rem 1.1rem; margin: 1.2rem 0; font-size: 0.95rem; }
.note-title { font-weight: 600; color: var(--accent); font-size: 0.88rem; margin-bottom: 0.3rem; letter-spacing: 0.06em; }
.point { background: var(--point-bg); border-radius: 4px; padding: 0.7rem 0.9rem; margin: 0.8rem 0; font-size: 0.97rem; }
.point::before { content: "★ ポイント　"; color: var(--accent); font-weight: 600; font-size: 0.85rem; }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 1rem 0 1.4rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { border: 1px solid var(--rule-light); padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
th { background: var(--note-bg); font-weight: 600; font-size: 0.85rem; color: var(--ink-soft); }
td .dev { font-size: 1.05rem; }
td.c, th.c { text-align: center; white-space: nowrap; }
.yes { color: var(--ok-color); font-weight: 600; }
.no { color: var(--it-color); font-weight: 600; }

/* kārikā card (LSK の sutra カードと同じ形) */
.sutra { background: var(--card-bg); border: 1px solid var(--rule-light); border-left: 4px solid var(--accent); border-radius: 4px; padding: 1rem 1.2rem 0.9rem; margin: 1rem 0; }
.sutra-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.9rem; margin-bottom: 0.2rem; }
.sutra-num { font-size: 0.78rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 0 0.45rem; white-space: nowrap; }
.sutra-text { font-family: 'Noto Serif Devanagari', serif; font-size: 1.2rem; font-weight: 600; line-height: 1.7; overflow-wrap: anywhere; }
.sutra-iast { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.05rem; color: var(--ink-soft); margin: 0.2rem 0 0.5rem; overflow-wrap: anywhere; }
.sutra-jp { font-size: 0.95rem; }

/* ===== 科段アコーディオン ===== */
.controls { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule-light); padding: 0.6rem 0; margin: 1rem 0 1.2rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.controls .lbl { font-size: 0.8rem; color: var(--muted); margin-right: 0.2rem; }
.controls button { font-family: 'Shippori Mincho', serif; font-size: 0.85rem; background: var(--card-bg); color: var(--accent); border: 1px solid var(--rule); border-radius: 999px; padding: 0.15rem 0.8rem; cursor: pointer; }
.controls button:hover, .controls button:focus-visible { border-color: var(--accent); }

details.node { border-left: 2px solid var(--rule-light); margin: 0.25rem 0 0.25rem 0; }
details.node > summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr auto; gap: 0.2rem 0.6rem; align-items: baseline;
  padding: 0.35rem 0.5rem 0.35rem 0.6rem; border-radius: 0 4px 4px 0;
}
details.node > summary::-webkit-details-marker { display: none; }
details.node > summary:hover { background: var(--note-bg); }
details.node > summary::before {
  content: "▸"; color: var(--accent-soft); font-size: 0.8rem; grid-column: 1; grid-row: 1;
  transition: transform 0.15s; display: inline-block; width: 0.8rem;
}
details.node[open] > summary::before { transform: rotate(90deg); }
details.node > summary .num { grid-column: 1; grid-row: 1; margin-left: 1.1rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--accent); font-size: 1.02rem; white-space: nowrap; }
details.node > summary .ttl { grid-column: 2; }
details.node > summary .ttl .sk { font-size: 0.85rem; color: var(--ink-soft); }
details.node > summary .refs { grid-column: 3; display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }
.ref { font-size: 0.72rem; border: 1px solid var(--rule); border-radius: 3px; padding: 0 0.35rem; color: var(--muted); white-space: nowrap; line-height: 1.6; font-family: 'Shippori Mincho', serif; }
.ref.k { border-color: var(--accent-soft); color: var(--accent); }
.ref.opp { color: var(--on-c); border: none; }
.opp.mim { background: var(--c-mim); } .opp.sam { background: var(--c-sam); } .opp.bud { background: var(--c-bud); }
.opp.car { background: var(--c-car); } .opp.self { background: var(--c-self); } .opp.gen { background: var(--c-gen); }
details.node > .body { padding: 0.1rem 0 0.4rem 1.2rem; }
details.node > .body > p.gist { font-size: 0.95rem; color: var(--ink-soft); margin: 0.2rem 0 0.5rem; }
details.node > .body > p.gist::before { content: "要旨　"; font-size: 0.75rem; color: var(--accent); font-weight: 600; letter-spacing: 0.1em; }
details.node.lv1 { border-left: 4px solid var(--accent); background: var(--card-bg); border-radius: 4px; margin: 0.8rem 0; padding: 0.2rem 0.4rem 0.4rem 0; }
details.node.lv1 > summary .num { font-size: 1.25rem; }
details.node.lv1 > summary .ttl { font-weight: 600; font-size: 1.08rem; }
details.node.lv2 > summary .ttl { font-weight: 600; }
details.node.leaf > summary::before { content: "·"; transform: none !important; }
@media (max-width: 560px) {
  details.node > summary { grid-template-columns: auto 1fr; }
  details.node > summary .refs { grid-column: 2; justify-content: flex-start; }
  details.node > .body { padding-left: 0.7rem; }
}

/* ===== 図：五つの異論 → 五つのスタバカ ===== */
.flow { display: grid; grid-template-columns: 1fr 2.2rem 1fr; gap: 0.5rem 0; align-items: stretch; margin: 1.2rem 0 1.6rem; }
.flow .q, .flow .a { border: 1px solid var(--rule-light); border-radius: 4px; padding: 0.5rem 0.75rem; font-size: 0.9rem; line-height: 1.6; background: var(--card-bg); }
.flow .q { border-left: 4px solid var(--it-color); }
.flow .a { border-left: 4px solid var(--ok-color); }
.flow .q b, .flow .a b { display: block; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.flow .arr { display: flex; align-items: center; justify-content: center; color: var(--accent-soft); font-size: 1.2rem; }
.flow .head { font-size: 0.8rem; color: var(--ink-soft); font-weight: 600; text-align: center; letter-spacing: 0.1em; }
@media (max-width: 560px) {
  .flow { grid-template-columns: 1fr; }
  .flow .arr { transform: rotate(90deg); height: 1.4rem; }
  .flow .head.h2, .flow .head.h3 { display: none; }
}

/* ===== 図：段落マップ（[1]–[80] の帯グラフ） ===== */
.map { display: flex; width: 100%; height: 2.4rem; border-radius: 4px; overflow: hidden; border: 1px solid var(--rule-light); margin: 0.8rem 0 0.3rem; }
.map > a { display: flex; align-items: center; justify-content: center; color: var(--on-c); font-size: 0.72rem; text-decoration: none; border-right: 1px solid var(--ground); font-family: 'Cormorant Garamond', serif; font-weight: 600; min-width: 0; overflow: hidden; }
.map > a:hover { filter: brightness(1.12); }
.map-scale { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.6rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 1rem; }
.legend span::before { content: ""; display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 2px; margin-right: 0.35rem; vertical-align: -0.05rem; background: var(--sw); }

/* ===== 図：五つの理由 → 結論 ===== */
.reasons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; margin: 1rem 0 0; }
.reasons div { background: var(--point-bg); border-radius: 4px; padding: 0.45rem 0.5rem; text-align: center; font-size: 0.85rem; line-height: 1.5; }
.reasons div .no-r { display: block; font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--accent); font-size: 1rem; }
.reasons div .iast { display: block; font-size: 0.9rem; color: var(--ink-soft); }
.converge { text-align: center; color: var(--accent-soft); font-size: 1.1rem; line-height: 1.2; margin: 0.2rem 0; }
.concl { border: 2px solid var(--accent); border-radius: 6px; text-align: center; padding: 0.5rem; font-weight: 600; margin-bottom: 1rem; }
.concl .dev { display: block; font-weight: 400; font-size: 1.05rem; }
@media (max-width: 560px) { .reasons { grid-template-columns: repeat(2, 1fr); } }

/* ===== 図：論敵の位置づけ ===== */
.opp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; margin: 1rem 0; }
.opp-card { border-radius: 4px; padding: 0.6rem 0.7rem; background: var(--card-bg); border: 1px solid var(--rule-light); border-top: 5px solid var(--sw); font-size: 0.88rem; line-height: 1.6; }
.opp-card b { display: block; font-size: 0.95rem; }
.opp-card .where { font-size: 0.78rem; color: var(--muted); }

footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); font-size: 0.85rem; color: var(--ink-soft); }
.tentative { font-size: 0.72rem; color: var(--it-color); border: 1px dashed var(--it-color); border-radius: 3px; padding: 0 0.3rem; margin-left: 0.3rem; white-space: nowrap; }

.opp.vai { background: var(--c-vai); }
.reasons.r3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 560px) { .reasons.r3 { grid-template-columns: 1fr; } }
h3.cap { margin-top: 0.6rem; }
details.fold { border: 1px solid var(--rule-light); border-radius: 4px; background: var(--card-bg); padding: 0.4rem 0.8rem; margin: 1rem 0; }
details.fold > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.92rem; }
.pm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.5rem; margin: 1rem 0; }
.pm { display: block; text-decoration: none; color: var(--ink); background: var(--card-bg); border: 1px solid var(--rule-light); border-left: 4px solid var(--ok-color); border-radius: 4px; padding: 0.5rem 0.75rem; font-size: 0.88rem; line-height: 1.6; }
.pm:hover { border-color: var(--accent); }
.pm b { display: block; color: var(--accent); font-size: 1rem; }
.pm .iast { display: block; color: var(--ink-soft); }
.pm .sec { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
.stats { display: grid; grid-template-columns: 6.5rem 1fr; gap: 0.35rem 0.8rem; align-items: center; margin: 1rem 0 0.4rem; font-size: 0.85rem; }
.stats .lab a { text-decoration: none; }
.stats .bars { display: flex; flex-direction: column; gap: 3px; }
.stats .bar { height: 0.95rem; border-radius: 2px; color: var(--on-c); font-size: 0.7rem; line-height: 0.95rem; padding-left: 0.35rem; white-space: nowrap; }
.stats .bar.p { background: var(--accent); }
.stats .bar.k { background: var(--accent-soft); }
section.stabaka { border-top: 1px solid var(--rule); margin-top: 3rem; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.2rem; padding: 0.7rem 0 0.8rem; border-bottom: 1px dashed var(--rule-light); position: relative; }
.seg-sa { font-size: 1.04rem; line-height: 1.9; overflow-wrap: anywhere; }
.seg-ja { font-size: 0.98rem; line-height: 1.95; }
.tnote { background: var(--note-bg); border-radius: 4px; padding: 0.55rem 0.9rem 0.6rem; margin: 0.4rem 0 0.9rem; font-size: 0.88rem; line-height: 1.85; }
.tnote-h { font-weight: 600; color: var(--accent); font-size: 0.78rem; letter-spacing: 0.1em; }
.tnote ol { padding-left: 1.3rem; }
.tnote b { color: var(--ink); }
.legend-tr { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 1.2rem; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--rule); padding-bottom: 0.3rem; margin: 1rem 0 0.2rem; }
.toc-tr a { text-decoration: none; }
@media (max-width: 640px) {
  .seg, .legend-tr { grid-template-columns: 1fr; }
  .legend-tr span:last-child { display: none; }
  .seg-ja { padding-left: 0.6rem; border-left: 3px solid var(--rule-light); }
}
.ref.mi { border-style: dashed; color: var(--muted); }
.progress { font-size: 0.85rem; color: var(--ink-soft); }
</style>
</head>
