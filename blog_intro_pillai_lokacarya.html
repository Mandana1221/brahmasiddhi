<h3>ピッライ・ローカーチャーリヤの宗教思想入門――大学1年生向けに公開</h3>

<p>
13〜14世紀の南インドで「救いはただ神の慈悲による」と説いた思想家、<strong>ピッライ・ローカーチャーリヤ（Piḷḷai Lokācārya）</strong>の考えを、
『ムムクシュッパディ』と『シュリーヴァチャナブーシャナム』の二著作をもとに、<strong>図と表</strong>でわかりやすくまとめました。
親鸞・ルター・カトリックなど、他の宗教との比較もまじえています。
</p>
